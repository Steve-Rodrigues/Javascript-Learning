<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="top-sep">
    <header>
        <p class="date">Tuesday, August 18</p>
        <h1>Good Morning, Steve.</h1>
    </header>
    <div class="progress">
        <div class="prog-bar">50%</div>
        <div class="num-left">2 of 4 completed today</div>
    </div>
    </div>
    <div class="main-card">
        <h3>My tasks</h3>
        <div class="input-info">
            <div class="inp-btn">
        <input type="text" class="task-input" placeholder="What needs to get done?">
        <button class="add-task">+</button></div>
        <ul class="tasks">
        </ul>
    </div>
    </div>
</body>
</html>
