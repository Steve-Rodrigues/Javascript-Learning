<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        Weather Forecast 
        <div class="right-header">
        <input type="text" class="location-search" placeholder="Enter a location">
        <div class="weather-choice"><span class="far">F</span><span class="cel">C</span></div>
        </div>
    </header>
    <div class="weather-card">
        <div class="date-time">Monday, August 13 • 5:57 PM</div>
        <div class="temp">
            72° <div class="emoji">☀️</div>
        </div>
        <h4 class="day-outlook">Partly Cloudy</h4>
        <div class="divider"></div>
        <div class="stats">
            <div class="feels-like">
                <p>Feels like</p>
                <h4>70°</h4>
            </div>
            <div class="wind">
                <p>Wind</p>
                <h4>8 mph</h4>
            </div>
            <div class="humid">
                <p>Humidity</p>
                <h4>54%</h4>
            </div>
        </div>
    </div>
    
</body>
</html>
